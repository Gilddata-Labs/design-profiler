# GildData Design Data Profiler: tests on Windows, macOS and Linux, the Docker image, and the release zips.
# Runs on every push and pull request once this repository is on GitHub. Nothing here needs a secret.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install openpyxl (compiler and catalogue workbooks only; the profiler itself needs nothing)
        run: python -m pip install openpyxl
      - name: Run every test file
        shell: bash
        run: |
          failed=""
          for t in tests/test_*.py; do
            echo "::group::$t"
            if ! python "$t"; then failed="$failed $t"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
      - name: Smoke test the command line on this OS
        shell: bash
        run: |
          mkdir -p smoke/Proj && printf 'ISO-10303-21;\nHEADER;\nFILE_NAME(%s);\nENDSEC;\n' "'a','',(''),(''),'','SolidWorks',''" > smoke/Proj/a.step
          python gilddesign.py check smoke --out smoke_out --seconds 5
          python gilddesign.py quick smoke --out smoke_out
          python gilddesign.py extract smoke --out smoke_out --fingerprint
          python gilddesign.py verify smoke_out
          python gilddesign.py catalogue smoke_out --out smoke_cat
      - name: Windows launcher starts (no folder given -> it must not hang)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo.| python gilddesign.py --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the hardened image
        run: docker build -t gilddesign:ci .
      - name: Run it sealed (read only folder, no network) on a sample folder
        run: |
          mkdir -p data/Proj output && printf 'x' > data/Proj/a.sldprt && chmod -R a+rX data && chmod a+rwx output
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/data:/data:ro" -v "$PWD/output:/out" gilddesign:ci
          ls output | grep -q '^profile_'

  release:
    needs: [tests, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist/
